<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang cá nhân của @yeaii2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      /* Hình nền dải ngân hà gradient động */
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #2e1065, #000000);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 50px 20px;
    }
    
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid transparent;
      background: linear-gradient(#1e1b4b, #1e1b4b) padding-box, 
                  linear-gradient(45deg, #6366f1, #ec4899, #8b5cf6) border-box;
      object-fit: cover;
      margin-bottom: 16px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
    }

    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; letter-spacing: 0.5px;}
    
    .badge {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 15px;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    p.bio { font-size: 15px; color: #cbd5e1; margin-bottom: 25px; text-align: center; line-height: 1.5; }

    /* Thiết kế thẻ Code */
    .code-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed #6366f1;
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 30px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .code-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 700; margin-bottom: 4px;}
    .code-value { font-size: 20px; font-weight: 800; color: #ec4899; letter-spacing: 1px;}
    .copy-btn { 
      background: #6366f1; border: none; padding: 8px 16px; border-radius: 8px; 
      color: white; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .copy-btn:hover { background: #4f46e5; transform: scale(1.05); }
    .copy-btn:active { transform: scale(0.95); }

    .links-container { width: 100%; display: flex; flex-direction: column; gap: 14px; }
    
    .btn {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    
    .btn span.icon { font-size: 22px; margin-right: 15px; }
    .btn span.text { flex-grow: 1; text-align: left; }
    
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-upcloud:hover { background: #7c3aed; border-color: #8b5cf6; }
    .btn-tiktok:hover { background: #FE2C55; border-color: #ff4b6f; }
    .btn-discord:hover { background: #5865F2; border-color: #7289da; }
    
    /* Trang trí hạt nhấp nháy */
    .sparkle { position: absolute; font-size: 20px; animation: float 3s infinite ease-in-out; }
    .s1 { top: 10%; left: 15%; animation-delay: 0s; }
    .s2 { top: 30%; right: 10%; font-size: 15px; animation-delay: 1s; }
    .s3 { bottom: 20%; left: 5%; font-size: 25px; animation-delay: 2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
      50% { transform: translateY(-20px) rotate(10deg); opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="sparkle s1">✨</div>
  <div class="sparkle s2">🌟</div>
  <div class="sparkle s3">⭐</div>

  <div class="profile-card">
    <img class="avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Binbin" alt="Avatar">

    <h1>@yeaii2</h1>
    <div class="badge">Official Creator</div>
    
    <p class="bio">
      ☁️ UpCloud Application Promoter<br>
      🎮 Chia sẻ game & Hướng dẫn nhận tài nguyên miễn phí
    </p>

    <div class="code-box">
      <div>
        <div class="code-title">Official Fixed Code</div>
        <div class="code-value" id="promoCode">upcloud123</div>
      </div>
      <button class="copy-btn" onclick="copyCode()">Copy</button>
    </div>

    <div class="links-container">
      
      <a href="https://up.cts6.com/apph5/#/?source_member=1526" target="_blank" class="btn btn-upcloud">
        <span class="icon">☁️</span>
        <span class="text">Đăng ký tài khoản UpCloud</span>
      </a>

      <a href="https://www.tiktok.com/@yeaii2" target="_blank" class="btn btn-tiktok">
        <span class="icon">🎵</span>
        <span class="text">Xem video trên TikTok</span>
      </a>

      <a href="https://discord.gg/YTBHPMDxAx" target="_blank" class="btn btn-discord">
        <span class="icon">💬</span>
        <span class="text">Tham gia Cộng đồng Discord</span>
      </a>

    </div>
  </div>

  <script>
    function copyCode() {
      const codeText = document.getElementById("promoCode").innerText;
      navigator.clipboard.writeText(codeText).then(() => {
        const btn = document.querySelector(".copy-btn");
        btn.innerText = "Đã Copy!";
        btn.style.background = "#10b981";
        setTimeout(() => {
          btn.innerText = "Copy";
          btn.style.background = "#6366f1";
        }, 2000);
      });
    }
  </script>

</body>
</html>
